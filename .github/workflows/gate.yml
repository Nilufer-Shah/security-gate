on:
  workflow_call:
    inputs:
      python-path:
        type: string
        default: ''
      run-tests:
        type: boolean
        default: true
jobs:
  tests:
    name: Access-control & security tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: echo "no if; path=${{ inputs.python-path }} run=${{ inputs.run-tests }}"
