# Reusable Security Gate — call this from any repo with `uses:`.
# Free, deterministic ($0/run, no LLM) layered checks + one consolidated report on the
# run's Summary page. Runs in the CALLER's context (checkout pulls the caller's code), so
# the caller's own tests (e.g. an access-control/IDOR matrix) run alongside the scanners.
#
# Usage (caller repo, .github/workflows/security.yml):
#   permissions:            # REQUIRED — reusable workflows can't request more than the caller grants
#     contents: read
#     actions: read
#   jobs:
#     gate:
#       uses: <owner>/security-gate/.github/workflows/gate.yml@main
#       with: { python-path: backend, node-path: frontend }

on:
  workflow_call:
    inputs:
      python-path: { description: 'Dir with requirements.txt + tests/ ("" skips Python)', type: string, default: '' }
      node-path: { description: 'Dir with package.json ("" skips Node)', type: string, default: '' }
      python-version: { type: string, default: '3.12' }
      node-version: { type: string, default: '20' }
      run-tests: { description: 'Run caller pytest in <python-path>/tests', type: boolean, default: true }
      semgrep-config: { type: string, default: 'p/python p/javascript p/typescript p/react p/security-audit p/owasp-top-ten p/secrets p/jwt' }

permissions:
  contents: read
  actions: read

jobs:
  tests:
    name: Access-control & security tests
    if: ${{ inputs.run-tests && inputs.python-path != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}
          cache: pip
          cache-dependency-path: ${{ inputs.python-path }}/requirements.txt
      - name: Install deps + pytest
        working-directory: ${{ inputs.python-path }}
        run: |
          pip install -r requirements.txt
          pip install pytest
      - name: Run test suite
        working-directory: ${{ inputs.python-path }}
        run: |
          if [ -d tests ]; then
            python -m pytest tests -q --junitxml="$GITHUB_WORKSPACE/pytest-report.xml"
          else
            echo "no tests/ dir — skipping"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tests-report
          path: pytest-report.xml
          if-no-files-found: warn

  sast:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install semgrep
      - name: Run Semgrep (blocks on ERROR severity; WARNING/INFO reported only)
        run: |
          CFG=""
          for c in ${{ inputs.semgrep-config }}; do CFG="$CFG --config $c"; done
          semgrep scan $CFG --json --output semgrep.json --metrics off . || true
          ERR=$(python3 -c "import json;print(sum(1 for r in json.load(open('semgrep.json')).get('results',[]) if r['extra'].get('severity')=='ERROR'))")
          WARN=$(python3 -c "import json;print(sum(1 for r in json.load(open('semgrep.json')).get('results',[]) if r['extra'].get('severity')!='ERROR'))")
          echo "Semgrep findings — ERROR: $ERR, WARNING/INFO: $WARN"
          if [ "$ERR" -gt 0 ]; then
            echo "::error::Semgrep found $ERR ERROR-severity issue(s) — see the semgrep-report artifact"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: semgrep-report
          path: semgrep.json
          if-no-files-found: warn

  secrets:
    name: Secrets scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          VER=$(curl -s https://api.github.com/repos/gitleaks/gitleaks/releases/latest \
                | sed -n 's/.*"tag_name": *"v\([^"]*\)".*/\1/p')
          curl -sSL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${VER}/gitleaks_${VER}_linux_x64.tar.gz"
          tar -xzf gitleaks.tar.gz gitleaks && sudo mv gitleaks /usr/local/bin/gitleaks
      - run: gitleaks detect --source . --redact --verbose --exit-code 1 --report-path gitleaks.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gitleaks-report
          path: gitleaks.json
          if-no-files-found: ignore

  sca:
    name: Dependency CVEs (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
      - name: Python deps (pip-audit)
        if: ${{ inputs.python-path != '' }}
        run: |
          pip install pip-audit
          pip-audit -r "${{ inputs.python-path }}/requirements.txt" -f json -o pip-audit.json || true
      - name: Node deps (npm audit)
        if: ${{ inputs.node-path != '' }}
        run: (cd "${{ inputs.node-path }}" && npm audit --json > "$GITHUB_WORKSPACE/npm-audit.json" || true)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sca-report
          path: |
            pip-audit.json
            npm-audit.json
          if-no-files-found: warn

  report:
    name: Consolidated report
    runs-on: ubuntu-latest
    needs: [tests, sast, secrets, sca]
    if: always()
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Nilufer-Shah/security-gate
          ref: main
          path: _gate
      - uses: actions/download-artifact@v4
        with:
          path: reports
      - name: Build consolidated summary
        env:
          TESTS_RESULT: ${{ needs.tests.result }}
          SAST_RESULT: ${{ needs.sast.result }}
          SECRETS_RESULT: ${{ needs.secrets.result }}
          SCA_RESULT: ${{ needs.sca.result }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: python3 _gate/scripts/security_report.py >> "$GITHUB_STEP_SUMMARY"
