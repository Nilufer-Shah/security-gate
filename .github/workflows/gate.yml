on:
  workflow_call:
    inputs:
      python-path: { type: string, default: '' }
      node-path: { type: string, default: '' }
      python-version: { type: string, default: '3.12' }
      node-version: { type: string, default: '20' }
      run-tests: { type: boolean, default: true }
      semgrep-config: { type: string, default: 'p/python p/security-audit' }
jobs:
  tests:
    name: Access-control & security tests
    if: ${{ inputs.run-tests && inputs.python-path != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: echo "tests path=${{ inputs.python-path }}"
  sast:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install semgrep
      - name: Run Semgrep
        run: |
          CFG=""
          for c in ${{ inputs.semgrep-config }}; do CFG="$CFG --config $c"; done
          semgrep scan $CFG --error --json --output semgrep.json --metrics off .
  secrets:
    name: Secrets scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          VER=$(curl -s https://api.github.com/repos/gitleaks/gitleaks/releases/latest \
                | sed -n 's/.*"tag_name": *"v\([^"]*\)".*/\1/p')
          curl -sSL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${VER}/gitleaks_${VER}_linux_x64.tar.gz"
          tar -xzf gitleaks.tar.gz gitleaks && sudo mv gitleaks /usr/local/bin/gitleaks
      - run: gitleaks detect --source . --redact --verbose --exit-code 1 --report-path gitleaks.json
  sca:
    name: Dependency CVEs (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
      - name: Node deps (npm audit)
        if: ${{ inputs.node-path != '' }}
        run: (cd "${{ inputs.node-path }}" && npm audit --json > "$GITHUB_WORKSPACE/npm-audit.json" || true)
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Python deps (pip-audit)
        if: ${{ inputs.python-path != '' }}
        run: |
          pip install pip-audit
          pip-audit -r "${{ inputs.python-path }}/requirements.txt" -f json -o pip-audit.json || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sca-report
          path: |
            pip-audit.json
            npm-audit.json
          if-no-files-found: warn
  report:
    name: Consolidated report
    runs-on: ubuntu-latest
    needs: [tests, sast, secrets, sca]
    if: always()
    steps:
      - run: echo "report placeholder tests=${{ needs.tests.result }}" >> "$GITHUB_STEP_SUMMARY"
